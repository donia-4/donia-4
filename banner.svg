<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#16101c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f75c7e"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <linearGradient id="monoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f75c7e"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g opacity="0.08">
    <circle cx="60" cy="40" r="1.5" fill="#ffffff"/>
    <circle cx="120" cy="90" r="1.5" fill="#ffffff"/>
    <circle cx="1100" cy="60" r="1.5" fill="#ffffff"/>
    <circle cx="1050" cy="230" r="1.5" fill="#ffffff"/>
    <circle cx="90" cy="250" r="1.5" fill="#ffffff"/>
  </g>

  <!-- monogram mark -->
  <g transform="translate(70,70)">
    <polygon points="0,80 40,0 80,80 60,80 40,40 20,80" fill="none" stroke="url(#monoStroke)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="70,80 100,20 130,80 112,80 100,55 88,80" fill="none" stroke="url(#monoStroke)" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- name -->
  <text x="230" y="145" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="4" fill="#ffffff">DONIA SHABAN</text>

  <!-- accent underline -->
  <rect x="232" y="165" width="360" height="4" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="230" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#b8b3c2">BACKEND DEVELOPER . NET / C#</text>

  <!-- right side small tag -->
  <text x="1130" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#6b6675" text-anchor="end">github.com/donia-4</text>
</svg>
